<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/bootstrap.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <script src="../../js/layout.js" defer></script>
    <title>Agendamentos | Clínica</title>
</head>
<body class="patient-create">
    <div class="d-flex flex-column md:flex-row min-vh-100">
        <clinic-sidebar active="appointments"></clinic-sidebar>
        <div class="d-flex flex-column flex-grow-1 min-w-0">
            <main class="flex-grow-1 p-5 md:p-9">
                <h1 class="text-2xl fw-semibold text-center mb-7">Agendamentos</h1>
                <button type="button" class="btn-outline mb-5" disabled title="Em breve">
                    <i class="bi bi-calendar-plus" aria-hidden="true"></i>
                    Adicionar agendamento
                </button>
                <div class="table-responsive">
                    <table class="table table-striped table-hover" data-page-size="10">
                        <caption class="visually-hidden">Agendamentos</caption>
                        <thead>
                            <tr>
                                <th scope="col">Horário de início</th>
                                <th scope="col">Horário de término</th>
                                <th scope="col">Data de início</th>
                                <th scope="col">Data de término</th>
                                <th scope="col">Dia da semana</th>
                                <th scope="col">Repetição</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </main>
            <clinic-footer></clinic-footer>
        </div>
    </div>
</body>
</html>
