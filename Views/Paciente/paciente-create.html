<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <title>Adicionar Paciente</title>
</head>
<body>

    <div class="d-flex position-relative" style="min-height: 100vh">
        <nav class="d-flex flex-column flex-shrink-0 bg-body border-end position-absolute top-0 start-0 h-100" style="width: 270px; z-index: 1000;">
            <div class="p-3 border-bottom d-flex align-items-center gap-3">
                <span class="rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center" style="width:40px;height:40px"><strong>JC</strong></span>
                <div class="lh-sm">
                    <strong class="d-block">Olá Marcelo!</strong>
                    <div class="mt-2 text-muted">
                        <i class="bi bi-bell me-2"></i>
                        <i class="bi bi-play-circle"></i>
                    </div>
                </div>
            </div>

            <ul class="nav flex-column mb-auto p-2 text-center">
                <li class="nav-item w-100"><a class="nav-link py-3 fs-5 w-100" href="#">Início</a></li>
                <li class="nav-item w-100"><a class="nav-link active py-3 fs-5 w-100" aria-current="page" href="#">Pacientes</a></li>
                <li class="nav-item w-100"><a class="nav-link py-3 fs-5 w-100" href="#">Consultas</a></li>
                <li class="nav-item w-100"><a class="nav-link py-3 fs-5 w-100" href="#">Relatórios</a></li>
                <li class="nav-item w-100"><a class="nav-link py-3 fs-5 w-100" href="#">Tarefas</a></li>
            </ul>

            <div class="p-3 border-top text-center">
                <a href="#" class="nav-link py-2 fs-6 w-100">Meu perfil</a>
                <a href="#" class="nav-link py-2 fs-6 w-100">Home</a>
                <a href="#" class="nav-link py-2 fs-6 w-100 text-danger">Sair</a>
            </div>
        </nav>

        <main class="flex-grow-1 p-4 bg-light d-flex flex-column justify-content-between" style="margin-left: 270px; min-height: 100vh;">
            <div class="container-fluid">
                <h1 class="text-center mb-4">Adicionar Paciente</h1>

                <div class="bg-white p-4 rounded-4 shadow-sm mb-4">
                    <h5 class="mb-4 text-secondary">Dados Pessoais</h5>
                    
                    <div class="row g-3 mb-4">
                        <div class="col-md-8">
                            <label class="form-label">Nome</label>
                            <input type="text" class="form-control" placeholder="Mário">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Data de Nascimento</label>
                            <input type="text" class="form-control" placeholder="xx/xx/xxxx">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Cpf</label>
                            <input type="text" class="form-control" placeholder="xxx.xxx.xxx-xx">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Telefone</label>
                            <input type="text" class="form-control" placeholder="(xx) xxxxx-xxxx">
                        </div>
                    </div>

                    <div class="border-top border-2 border-opacity-25 pt-4 text-center" style="border-style: dashed !important;">
                        <button class="btn btn-outline-dark px-4 py-2 d-inline-block">Criar agendamento</button>
                    </div>

                    <div class="border-top border-2 border-opacity-25 pt-4 mt-4 text-center" style="border-style: dashed !important;">
                        <button class="btn btn-outline-dark px-4 py-2 d-inline-block">Criar perfil</button>
                    </div>

                    <div class="border-top border-2 border-opacity-25 pt-4 mt-4 text-center" style="border-style: dashed !important;">
                        <button class="btn btn-outline-dark px-4 py-2 d-inline-block">Criar Encaminhamento</button>
                    </div>

                    <div class="d-flex justify-content-end mt-4">
                        <button class="btn btn-dark px-4 py-2">Adicionar Paciente</button>
                    </div>
                </div>
            </div>

            <footer class="bg-white border p-4 rounded-3 text-center text-muted mt-auto">
                Footer
            </footer>
        </main>
    </div>

    <script type="module" src="../../js/bootstrap.min.js"></script>
</body>
</html>
