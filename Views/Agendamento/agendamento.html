<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento</title>
    <link rel="stylesheet" href="../../css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <script src="../../js/layout.js" defer></script>
</head>
<body class="schedule-page">
    <div class="d-flex flex-column md:flex-row min-vh-100">
        <clinic-sidebar active="scheduling"></clinic-sidebar>
        <div class="d-flex flex-column flex-grow-1 min-w-0">
            <main class="flex-grow-1 p-5 md:p-9">
                <div class="mx-auto" style="max-width: 1000px;">
                    <header class="text-center mb-8">
                        <h1 class="text-2xl fw-semibold mb-3">Agendamento</h1>
                        <p class="text-sm mb-0" style="color: var(--color-text-muted);">Edite os dados do agendamento.</p>
                    </header>
                      <div class="d-flex flex-wrap align-items-center justify-content-between gap-5 mt-7">
                            <button class="btn-solid px-7 py-4 btn-outline-dark rounded-4 mb-4 px-4 py-2 d-inline-block" type="submit">
                                <i class="bi bi-list" aria-hidden="true"></i>
                              Adicionar agendamento
                            </button>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th scope=".col">Horario Inicio</th>
                                <th scope=".col">Horario Termino</th>
                                <th scope=".col">Data Inicio</th>
                                <th scope=".col">Data Termino</th>
                                <th scope=".col">Dia da Semana</th>
                                <th scope=".col">Repetição</th>
                                <th scope=".col">Ações</th>
                            </tr>
                        </thead>
                <tbody>
                    <tr>
                        <td scope=".col">XX:XX</td>
                        <td scope=".col">XX:XX</td>
                        <td scope=".col">XX/XX/XXXX</td>
                        <td scope=".col">XX/XX/XXXX</td>
                        <td scope=".col">Sexta</td>
                        <td scope=".col">Quinzenal</td>
                        <td>
                            <button class="btn btn-sm btn-link text-light p-1"><i class="bi bi-pencil-fill"></i></button>
                            <button class="btn btn-sm btn-link text-light p-1"><i class="bi bi-eye-fill"></i></button>
                        </td>
                    </tr>
                    <!-- Linha 2 -->
                    <tr>
                        <td scope=".col">XX:XX</td>
                        <td scope=".col">XX:XX</td>
                        <td scope=".col">XX/XX/XXXX</td>
                        <td scope=".col">XX/XX/XXXX</td>
                        <td scope=".col">Sábado</td>
                        <td scope=".col">Mensal</td>
                        <td>
                            <button class="btn btn-sm btn-link text-light p-1"><i class="bi bi-pencil-fill"></i></button>
                            <button class="btn btn-sm btn-link text-light p-1"><i class="bi bi-eye-fill"></i></button>
                        </td>
                    </tr>
                    <!-- Linha 3 -->
                    <tr>
                        <td scope=".col">XX:XX</td>
                        <td scope=".col">XX:XX</td>
                        <td scope=".col">XX/XX/XXXX</td>
                        <td scope=".col">XX/XX/XXXX</td>
                        <td scope=".col">Terça</td>
                        <td scope=".col">Semanal</td>
                        <td>
                            <button class="btn btn-sm btn-link text-light p-1"><i class="bi bi-pencil-fill"></i></button>
                            <button class="btn btn-sm btn-link text-light p-1"><i class="bi bi-eye-fill"></i></button>
                        </td>
                    </tr>
                        </tbody>
                    </table>
            </div>
        </main>
   
    <script type="module" src="../../js/bootstrap.min.js"></script>
</body>
</html>
