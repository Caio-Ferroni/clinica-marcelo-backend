<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <script src="../../js/layout.js" defer></script>
    <title>Adicionar Paciente</title>
</head>
<body>
    <div class="d-flex flex-column md:flex-row min-vh-100">
        <clinic-sidebar active="patients"></clinic-sidebar>
        <div class="d-flex flex-column flex-grow-1 min-w-0">
            <main class="flex-grow-1 p-4 bg-light">
                <div class="container-fluid">
                    <h1 class="text-center mb-4">Adicionar Paciente</h1>

                    <div class="bg-white p-4 rounded-4 shadow-sm mb-4">
                        <h5 class="mb-4 text-secondary">Dados Pessoais</h5>

                        <div class="row g-3 mb-4">
                            <div class="col-md-8">
                                <label class="form-label">Nome</label>
                                <input type="text" class="form-control" placeholder="Mário">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Data de Nascimento</label>
                                <input type="text" class="form-control" placeholder="xx/xx/xxxx">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Cpf</label>
                                <input type="text" class="form-control" placeholder="xxx.xxx.xxx-xx">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Telefone</label>
                                <input type="text" class="form-control" placeholder="(xx) xxxxx-xxxx">
                            </div>
                        </div>

                        <div class="border-top border-2 border-opacity-25 pt-4 text-center" >
                            <button class="btn btn-outline-dark px-4 py-2 d-inline-block">Criar agendamento</button>
                        </div>

                        <div class="border-top border-2 border-opacity-25 pt-4 mt-4 text-center" >
                            <button class="btn btn-outline-dark px-4 py-2 d-inline-block">Criar perfil</button>
                        </div>

                        <div class="border-top border-2 border-opacity-25 pt-4 mt-4 text-center" >
                            <button class="btn btn-outline-dark px-4 py-2 d-inline-block">Criar Encaminhamento</button>
                        </div>

                        <div class="d-flex justify-content-end mt-4">
                            <button class="btn btn-dark px-4 py-2">Adicionar Paciente</button>
                        </div>
                    </div>
                </div>
            </main>
            <clinic-footer></clinic-footer>
        </div>
    </div>

    <script type="module" src="../../js/bootstrap.min.js"></script>
</body>
</html>
