<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar tarefa | Clínica</title>
    <link rel="stylesheet" href="../../css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <script src="../../js/layout.js" defer></script>
</head>
<body class="patient-create">
    <div class="d-flex flex-column md:flex-row min-vh-100">
        <clinic-sidebar active="tasks"></clinic-sidebar>
        <div class="d-flex flex-column flex-grow-1 min-w-0">
            <main class="flex-grow-1 p-5 md:p-9">
                <!-- PHP (ao migrar para .php): no topo do arquivo, buscar o registro pelo id recebido (?id=) e carregar os dados do banco. Os caminhos ../../css e ../../js continuam iguais. -->
                <div class="mx-auto" style="max-width: 1000px;">
                    <header class="text-center mb-8">
                        <h1 class="text-2xl fw-semibold mb-3">Editar tarefa</h1>
                        <p class="text-sm mb-0" style="color: var(--color-text-muted);">Atualize as informações da tarefa.</p>
                    </header>

                    <!-- Backend: ao migrar, enviar por POST para o script PHP de atualização e incluir token CSRF em um campo oculto. Preencher os value e o textarea com os dados do banco. -->
                    <form id="edit-form" action="tarefa-edit.html" method="post">
                        <input type="hidden" name="id" value="1">
                        <div class="border rounded-4 shadow-sm" style="background: var(--color-surface);">
                            <section class="p-7 md:p-9" aria-labelledby="task-heading">
                                <h2 id="task-heading" class="text-md fw-semibold d-flex align-items-center gap-3 mb-7">
                                    <i class="bi bi-clipboard-check" aria-hidden="true"></i>
                                    Dados da tarefa
                                </h2>
                                <div class="row g-5">
                                    <div class="col-12 md:col-8">
                                        <label class="form-label text-sm" for="task-title">Tarefa <span aria-hidden="true">*</span></label>
                                        <input class="form-control" type="text" id="task-title" name="titulo" value="Nome tarefa" placeholder="Digite o nome da tarefa" required>
                                    </div>
                                    <div class="col-12 md:col-4">
                                        <label class="form-label text-sm" for="task-due-date">Data de conclusão</label>
                                        <input class="form-control" type="date" id="task-due-date" name="data_conclusao" value="2026-11-20">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label text-sm" for="task-description">Descrição da tarefa</label>
                                        <textarea class="form-control" id="task-description" name="descricao" rows="6" placeholder="Descreva a tarefa.">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Quisque faucibus ex sapien vitae pellentesque sem placerat.</textarea>
                                    </div>
                                </div>
                            </section>
                        </div>

                        <div class="d-flex flex-wrap align-items-center justify-content-between gap-5 mt-7">
                            <small style="color: var(--color-text-muted);">* Campo obrigatório</small>
                            <div class="d-flex flex-wrap gap-4">
                                <a class="btn-outline px-7 py-4 text-decoration-none" href="tarefa-view.html?id=1">Cancelar</a>
                                <button class="btn-solid px-7 py-4" type="submit">
                                    <i class="bi bi-check-lg" aria-hidden="true"></i>
                                    Salvar alterações
                                </button>
                            </div>
                        </div>
                        <p id="save-message" class="border rounded-3 p-5 mt-5 mb-0" role="status" hidden style="background: var(--color-light-blue); color: var(--color-dark-blue);">A edição ainda não está disponível. Nenhum dado foi salvo.</p>
                    </form>
                </div>
            </main>
            <clinic-footer></clinic-footer>
        </div>
    </div>
</body>
</html>
