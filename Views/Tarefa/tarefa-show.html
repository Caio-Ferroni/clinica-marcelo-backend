<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizar tarefa | Clínica</title>
    <link rel="stylesheet" href="../../css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <script src="../../js/layout.js" defer></script>
</head>
<body class="task-view">
    <div class="d-flex flex-column md:flex-row min-vh-100">
        <clinic-sidebar active="tasks"></clinic-sidebar>
        <div class="d-flex flex-column flex-grow-1 min-w-0">
            <main class="flex-grow-1 p-5 md:p-9">
                <!-- PHP (ao migrar para .php): no topo do arquivo, carregar os dados do banco e, se necessário, exigir login. Os caminhos ../../css e ../../js continuam iguais. -->
                <div class="mx-auto" style="max-width: 1000px;">
                    <header class="text-center mb-8">
                        <h1 class="text-2xl fw-semibold mb-0">Visualizar tarefa</h1>
                    </header>
                    <div class="border rounded-4 shadow-sm p-7 md:p-9" style="background: var(--color-surface);" data-id="1">
                        <div class="row g-5">
                            <div class="col-12 md:col-6">
                                <label class="form-label text-sm" for="v-titulo">Tarefa</label>
                                <input class="form-control" type="text" id="v-titulo" value="Nome tarefa" readonly data-field="titulo">
                            </div>
                            <div class="col-12 md:col-6">
                                <label class="form-label text-sm" for="v-data_conclusao">Data de conclusão</label>
                                <input class="form-control" type="text" id="v-data_conclusao" value="XX/XX/XXXX" readonly data-field="data_conclusao">
                            </div>
                            <div class="col-12 md:col-12">
                                <label class="form-label text-sm" for="v-descricao">Descrição da tarefa</label>
                                <textarea class="form-control" id="v-descricao" rows="5" readonly data-field="descricao">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Quisque faucibus ex sapien vitae pellentesque sem placerat.</textarea>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex flex-wrap justify-content-between gap-5 mt-7">
                        <a class="btn-outline px-7 py-4 text-decoration-none" href="tarefas.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> Voltar</a>
                        <a class="btn-solid px-7 py-4 text-decoration-none" href="tarefa-edit.html?id=1"><i class="bi bi-pencil" aria-hidden="true"></i> Editar</a>
                    </div>
                </div>
            </main>
            <clinic-footer></clinic-footer>
        </div>
    </div>
</body>
</html>
