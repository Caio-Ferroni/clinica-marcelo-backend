<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizar consulta | Clínica</title>
    <link rel="stylesheet" href="../../css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <script src="../../js/layout.js" defer></script>
</head>
<body class="appointment-view">
    <div class="d-flex flex-column md:flex-row min-vh-100">
        <clinic-sidebar active="appointments"></clinic-sidebar>
        <div class="d-flex flex-column flex-grow-1 min-w-0">
            <main class="flex-grow-1 p-5 md:p-9">
                <!-- PHP (ao migrar para .php): no topo do arquivo, carregar os dados do banco e, se necessário, exigir login. Os caminhos ../../css e ../../js continuam iguais. -->
                <div class="mx-auto" style="max-width: 1000px;">
                    <header class="text-center mb-8">
                        <h1 class="text-2xl fw-semibold mb-0">Visualizar consulta</h1>
                    </header>
                    <div class="border rounded-4 shadow-sm p-7 md:p-9" style="background: var(--color-surface);" data-id="1">
                        <div class="row g-5">
                            <div class="col-12 md:col-6">
                                <label class="form-label text-sm" for="v-data_consulta">Consulta</label>
                                <input class="form-control" type="text" id="v-data_consulta" value="20/10/2026 - Futuro" readonly data-field="data_consulta">
                            </div>
                            <div class="col-12 md:col-6">
                                <label class="form-label text-sm" for="v-status">Status</label>
                                <input class="form-control" type="text" id="v-status" value="Concluído" readonly data-field="status">
                            </div>
                            <div class="col-12">
                                <label class="form-label text-sm" for="v-relatorio">Relatório</label>
                                <div class="border rounded-3 p-6 text-center" id="v-relatorio" data-field="relatorio" style="background: var(--color-field-background);">
                                    <a class="btn-outline px-7 py-4 text-decoration-none" href="../Relatorios/relatorio-create.html?consulta_id=1">Criar relatório</a>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="mt-7">
                        <a class="btn-outline px-7 py-4 text-decoration-none" href="consultas.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> Voltar</a>
                    </div>
                </div>
            </main>
            <clinic-footer></clinic-footer>
        </div>
    </div>
</body>
</html>
